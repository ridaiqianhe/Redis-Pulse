services:
  redis-api:
    build: .
    container_name: redis-api
    restart: always
    network_mode: host
    env_file:
      - config
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request; port = os.environ.get('API_PORT', '16379'); urllib.request.urlopen(f'http://127.0.0.1:{port}/api/counts', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
